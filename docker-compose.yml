services:
  # App: Laravel Dashboard
  dashboard:
    # CI/CD-friendly image reference (defaults to local image tag)
    image: ${DOCKERHUB_REPO:-yotta-iot-dashboard}:${IMAGE_TAG:-latest}

    # Local build support (CI can still pull/push via the image tag)
    build:
      context: .
      dockerfile: dockerfile

    container_name: yotta-dashboard
    restart: unless-stopped
    ports:
      - "8002:8002"

    # Environment is loaded from .env (generated by CI when needed)
    env_file:
      - .env

    # Wait until MySQL healthcheck passes before starting the app
    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - laravel

    # Container health check used by local/dev verification
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # DB: MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: yotta-mysql
    restart: unless-stopped

    # Bind to localhost to avoid exposing the database publicly
    ports:
      - "127.0.0.1:4406:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-yotta_db}
      MYSQL_USER: ${DB_USERNAME:-yotta}
      MYSQL_PASSWORD: ${DB_PASSWORD:-yotta_pass}

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - laravel

    # Used by depends_on (service_healthy)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Optional tool: enable with `docker compose --profile tools up -d`
  phpmyadmin:
    profiles: ["tools"]
    image: phpmyadmin/phpmyadmin:latest
    container_name: yotta-phpmyadmin
    restart: unless-stopped
    ports:
      - "8001:80"
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    networks:
      - laravel

volumes:
  db_data:

networks:
  laravel:
    driver: bridge
